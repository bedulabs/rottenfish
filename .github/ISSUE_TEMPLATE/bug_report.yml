name: Bug Report
description: Report something that is broken in Rotten Fish
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill this out as
        completely as you can. Incomplete reports take longer to resolve.

        Do not report security vulnerabilities here. Use the private security
        advisory link on the new issue page instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues and this has not been reported.
          required: true
        - label: I am running the latest commit on the relevant branch.
          required: true
        - label: This is a bug, not a feature request or a question.
          required: true

  - type: dropdown
    id: branch
    attributes:
      label: Affected Branch or Component
      description: Which part of Rotten Fish is broken?
      options:
        - main
        - kernel
        - vault
        - cli
        - docs
        - governance
        - binding-java
        - binding-kotlin
        - binding-python
        - binding-javascript
        - binding-swift
        - binding-go
        - binding-rust
        - binding-c
        - packaging
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or Commit Hash
      description: What version or commit are you running?
      placeholder: "e.g. v0.1.0 or 4f2a9c1"
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select every platform where you reproduced the bug.
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - iOS
        - WebAssembly
        - Termux
        - Embedded
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Language and Runtime Version
      description: Include the language and version if you are using a binding.
      placeholder: "e.g. Python 3.12.2, Node 20.11.0, JDK 21"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What Happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What Did You Expect to Happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps so anyone can reproduce it.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Output
      description: Paste any error messages or stack traces. Remove secrets, keys, and personal data first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, related issues, workarounds, anything else useful.
    validations:
      required: false

  - type: checkboxes
    id: willingness
    attributes:
      label: Would You Like to Work on This?
      options:
        - label: I would like to submit a fix for this bug.
          required: false