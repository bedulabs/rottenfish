[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rottenfish"
version = "0.0.1"
description = "Python binding for Rotten Fish — universal identity and data ownership"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bedu Labs" }]
keywords = [
    "identity",
    "ssi",
    "verifiable-credentials",
    "privacy",
    "data-ownership",
    "decentralized",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/bedulabs/rottenfish"
Repository = "https://github.com/bedulabs/rottenfish"
Issues = "https://github.com/bedulabs/rottenfish/issues"
Documentation = "https://github.com/bedulabs/rottenfish/tree/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "cryptography>=42.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
sync = []
wasm = []

[tool.setuptools.packages.find]
where = ["."]
include = ["rottenfish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true